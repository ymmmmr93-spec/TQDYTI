<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋恋风尘式青春人格测试</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
        body{background:#f7f3ee;color:#3d3a34;line-height:1.7}
        .container{max-width:700px;margin:0 auto;padding:20px}
        .title{text-align:center;margin:30px 0;font-size:22px;font-weight:500}
        .desc{text-align:center;color:#666;margin-bottom:30px;font-size:14px}
        .question{background:#fff;border-radius:12px;padding:20px;margin-bottom:15px}
        .q-title{font-weight:500;margin-bottom:12px}
        .options{display:flex;flex-direction:column;gap:10px}
        .option{padding:12px;border:1px solid #ddd;border-radius:8px;cursor:pointer}
        .option:hover{border-color:#bfa98e;background:#fcf9f5}
        .option.active{background:#bfa98e;color:white;border-color:#bfa98e}
        .btn{background:#bfa98e;color:white;border:none;padding:14px 30px;border-radius:30px;margin:30px auto;display:block;font-size:16px;cursor:pointer}
        .btn:disabled{background:#ccc}
        .result{display:none;background:#fff;border-radius:12px;padding:30px;margin:30px 0}
        .result-title{font-size:18px;font-weight:500;margin-bottom:15px}
        .result-type{color:#bfa98e;font-weight:bold;margin-bottom:10px}
        .result-desc{line-height:1.8}
        .progress{text-align:center;margin:20px 0;color:#666}
    </style>
</head>
<body>
    <div class="container">
        <div class="title">恋恋风尘式青春人格测试</div>
        <div class="desc">清淡、克制、细碎遗憾的台青片青春人格</div>
        <div class="progress" id="progress">第 1 题 / 共 12 题</div>

        <div id="questions"></div>
        <button class="btn" id="submit" disabled>查看结果</button>

        <div class="result" id="result">
            <div class="result-title">你的专属青春人格</div>
            <div class="result-type" id="type"></div>
            <div class="result-desc" id="desc"></div>
        </div>
    </div>

    <script>
        const questions = [
            {
                q:"1. 放学后傍晚，你更倾向于？",
                A:"A. 沿田埂街巷慢慢走，安静独处【岸】",
                B:"B. 约好友闲逛街头，享受热闹【野】",
                dim:"any",key:"an_ye"
            },
            {
                q:"2. 面对平淡日常，你会？",
                A:"A. 接纳平淡，找细碎美好【岸】",
                B:"B. 偶尔出逃，看新风景【野】",
                dim:"any",key:"an_ye"
            },
            {
                q:"3. 有人约你去大城市闯荡，第一反应是？",
                A:"A. 犹豫退缩，贪恋安稳【岸】",
                B:"B. 心动想尝试，走出舒适圈【野】",
                dim:"any",key:"an_ye"
            },
            {
                q:"4. 青春里你更在意？",
                A:"A. 家人烟火、当下安稳【光】",
                B:"B. 未说出口的心意、淡淡怅惘【雾】",
                dim:"any",key:"guang_wu"
            },
            {
                q:"5. 看到旧物，你会想到？",
                A:"A. 温暖瞬间，只记美好【光】",
                B:"B. 未完成的承诺，心里难过【雾】",
                dim:"any",key:"guang_wu"
            },
            {
                q:"6. 面对喜欢的人，你更关注？",
                A:"A. 日常状态，默默关心【光】",
                B:"B. 细碎相处瞬间，反复回想【雾】",
                dim:"any",key:"guang_wu"
            },
            {
                q:"7. 被误解难过时，你会？",
                A:"A. 不辩解，默默消化【温】",
                B:"B. 释放情绪，找信任的人说【烈】",
                dim:"any",key:"wen_lie"
            },
            {
                q:"8. 喜欢的人要离开，你会？",
                A:"A. 默默送别，不说挽留【温】",
                B:"B. 说出心意，不留遗憾【烈】",
                dim:"any",key:"wen_lie"
            },
            {
                q:"9. 面对不合理要求，你会？",
                A:"A. 不忍拒绝，默默承受【温】",
                B:"B. 委婉拒绝，坚守自己【烈】",
                dim:"any",key:"wen_lie"
            },
            {
                q:"10. 面对没有结果的喜欢，你会？",
                A:"A. 顺其自然，慢慢放下【缓】",
                B:"B. 默默坚守，守住期待【骤】",
                dim:"any",key:"huan_zhou"
            },
            {
                q:"11. 毕业离别，你会？",
                A:"A. 接受离别，坦然面对【缓】",
                B:"B. 努力留住痕迹，记住瞬间【骤】",
                dim:"any",key:"huan_zhou"
            },
            {
                q:"12. 面对未来不确定，你会？",
                A:"A. 不焦虑，一步一步走【缓】",
                B:"B. 悄悄规划，朝期待前行【骤】",
                dim:"any",key:"huan_zhou"
            }
        ];

        const answers = {an_ye:[], guang_wu:[], wen_lie:[], huan_zhou:[]};
        let current = 0;

        function render(){
            const dom = document.getElementById("questions");
            dom.innerHTML = "";
            const item = questions[current];
            const div = document.createElement("div");
            div.className = "question";
            div.innerHTML = `
                <div class="q-title">${item.q}</div>
                <div class="options">
                    <div class="option" data-ans="A">${item.A}</div>
                    <div class="option" data-ans="B">${item.B}</div>
                </div>
            `;
            dom.appendChild(div);
            document.getElementById("progress").innerText = `第 ${current+1} 题 / 共 12 题`;

            document.querySelectorAll(".option").forEach(opt=>{
                opt.onclick = ()=>{
                    document.querySelectorAll(".option").forEach(o=>o.classList.remove("active"));
                    opt.classList.add("active");
                    answers[item.key].push(opt.dataset.ans);
                    setTimeout(()=>{
                        current++;
                        if(current<12){
                            render();
                        }else{
                            document.getElementById("submit").disabled = false;
                        }
                    },300);
                }
            });
        }

        function calc(key,a,b){
            const arr = answers[key];
            let ca=0,cb=0;
            arr.forEach(i=>i==="A"?ca++:cb++);
            return ca>=cb ? a : b;
        }

        const resultMap = {
            "岸光温缓":"【清淡烟火型】阿远（恋恋风尘）/小凯（一页台北）/文清（悲情城市）｜内敛隐忍、务实真诚，在烟火气里安静成长。",
            "岸光温骤":"【安稳坚守型】冬冬（冬冬的假期）｜温暖明朗、内敛克制，于安稳中藏着执着。",
            "岸光烈缓":"【坦荡释然型】Susie（一页台北）｜温暖坦荡，带点锋芒，坦然接受一切。",
            "岸光烈骤":"【热烈安稳型】张士豪（蓝色大门）｜温暖热烈、真诚坦荡，少年气十足。",
            "岸雾温缓":"【青涩自愈型】孟克柔（蓝色大门）｜温柔敏感、沉默自愈，青涩又坚韧。",
            "岸雾温骤":"【遗憾坚守型】阿云（恋恋风尘）/小四（牯岭街）/康南（窗外）｜念旧执着，藏着青春怅惘。",
            "岸雾烈缓":"【敏感释然型】婷婷（一一）｜温柔敏感，在脆弱中学会坚强。",
            "岸雾烈骤":"【坚韧挣扎型】小明（牯岭街）/江雁容（窗外）｜敏感带锋芒，在现实中挣扎不妥协。",
            "野光温缓":"【天真治愈型】小猫王（牯岭街）｜开朗纯粹，青春里最治愈的亮色。",
            "野光温骤":"【隐藏人格】🌿 温柔与坚守并存，你是自己青春的主人公。",
            "野光烈缓":"【鲜活坦荡型】张士豪/Susie｜开朗坦荡、热烈纯粹，鲜活有力量。",
            "野光烈骤":"【隐藏人格】🔥 热烈又执着，你是自带光芒的主角。",
            "野雾温缓":"【隐藏人格】✨ 叛逆中藏温柔，独一无二。",
            "野雾温骤":"【隐藏人格】🌙 敏感又执着，无可替代的主人公。",
            "野雾烈缓":"【隐藏人格】🌿 温柔中带锋芒，最动人的主角。",
            "野雾烈骤":"【热烈悲剧型】哈尼（牯岭街）｜叛逆纯粹、热烈勇敢，令人心疼。"
        };

        document.getElementById("submit").onclick = ()=>{
            const an_ye = calc("an_ye","岸","野");
            const guang_wu = calc("guang_wu","光","雾");
            const wen_lie = calc("wen_lie","温","烈");
            const huan_zhou = calc("huan_zhou","缓","骤");
            const type = an_ye + guang_wu + wen_lie + huan_zhou;
            document.getElementById("type").innerText = type;
            document.getElementById("desc").innerText = resultMap[type] || "未知人格";
            document.querySelector(".result").style.display = "block";
            window.scrollTo(0,document.body.scrollHeight);
        };

        render();
    </script>
</body>
</html>
