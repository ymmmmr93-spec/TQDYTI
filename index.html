// 答题记录
const answer = { an_ye: [], guang_wu: [], wen_lie: [], huan_zhou: [] };
let current = 0;

// 渲染题目
function render() {
  const q = questions[current];
  const container = document.getElementById("questionContainer");
  container.innerHTML = `
    <div class="question-box">
      <div class="question-text">${q.title}</div>
      <div class="option" data-val="A">${q.A}</div>
      <div class="option" data-val="B">${q.B}</div>
    </div>
  `;
  document.getElementById("progress").innerText = `第 ${current+1} 题 / 共 12 题`;

  document.querySelectorAll(".option").forEach(opt => {
    opt.onclick = () => {
      document.querySelectorAll(".option").forEach(o => o.classList.remove("active"));
      opt.classList.add("active");
      answer[q.dim].push(opt.dataset.val);
      setTimeout(() => {
        current++;
        if (current < 12) render();
        else document.getElementById("submitBtn").disabled = false;
      }, 200);
    };
  });
}

// 计算维度
function getDim(key, A, B) {
  const arr = answer[key];
  let a = 0, b = 0;
  arr.forEach(v => v === "A" ? a++ : b++);
  return a >= b ? A : B;
}

// 计算结果
document.getElementById("submitBtn").onclick = () => {
  const an_ye = getDim("an_ye", "岸", "野");
  const guang_wu = getDim("guang_wu", "光", "雾");
  const wen_lie = getDim("wen_lie", "温", "烈");
  const huan_zhou = getDim("huan_zhou", "缓", "骤");
  const key = an_ye + guang_wu + wen_lie + huan_zhou;
  const res = resultData[key];

  document.getElementById("resultDim").innerText = key;
  document.getElementById("resultRole").innerText = res.role;
  document.getElementById("resultDesc").innerText = res.desc;
  document.getElementById("result").style.display = "block";
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
};

render();
